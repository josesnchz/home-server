<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Deployed Home Server Services</title>
  <desc id="desc">Diagram showing the deployed Kubernetes services Grafana and Homepage with their MetalLB IP addresses.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071525"/>
      <stop offset="1" stop-color="#102b45"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" x2="1">
      <stop offset="0" stop-color="#173c52"/>
      <stop offset="1" stop-color="#1d5a70"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 48px; font-weight: 700; fill: #f8fbff; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 22px; fill: #afc5d9; }
      .section { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 2px; fill: #87d7e7; }
      .card-title { font-family: Arial, Helvetica, sans-serif; font-size: 32px; font-weight: 700; fill: #f8fbff; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 17px; font-weight: 700; letter-spacing: 1.2px; fill: #a9c1d2; }
      .value { font-family: Arial, Helvetica, sans-serif; font-size: 25px; font-weight: 700; fill: #ffffff; }
      .detail { font-family: Arial, Helvetica, sans-serif; font-size: 19px; fill: #c4d5e2; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 17px; fill: #b6ccdc; }
      .pill { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #082033; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1440" cy="100" r="260" fill="#1c5677" opacity="0.18"/>
  <circle cx="120" cy="850" r="290" fill="#168b91" opacity="0.12"/>

  <text class="title" x="110" y="118">Deployed Home Server Services</text>
  <text class="subtitle" x="110" y="158">Kubernetes LoadBalancer endpoints on the local network</text>

  <rect x="110" y="215" width="1380" height="152" rx="22" fill="url(#metal)" stroke="#4e9aac" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="174" cy="291" r="34" fill="#64d2c6"/>
  <path d="M157 290h34M174 273v34" stroke="#073044" stroke-width="5" stroke-linecap="round"/>
  <text class="section" x="236" y="270">EXPOSURE LAYER</text>
  <text class="card-title" x="236" y="316">MetalLB — L2 LoadBalancer</text>
  <rect x="1172" y="258" width="244" height="55" rx="28" fill="#80e4d8"/>
  <text class="pill" x="1213" y="293">LAN 192.168.0.0/24</text>

  <path d="M493 367 V438" stroke="#64d2c6" stroke-width="4"/>
  <path d="M1107 367 V438" stroke="#64d2c6" stroke-width="4"/>
  <circle cx="493" cy="422" r="9" fill="#64d2c6"/>
  <circle cx="1107" cy="422" r="9" fill="#64d2c6"/>

  <rect x="110" y="438" width="645" height="328" rx="24" fill="#102940" stroke="#3d7798" stroke-width="2" filter="url(#shadow)"/>
  <rect x="110" y="438" width="645" height="12" rx="6" fill="#f05b7c"/>
  <circle cx="174" cy="521" r="35" fill="#f05b7c"/>
  <path d="M156 530c8-19 16-31 20-31s12 12 20 31M161 516h30" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <text class="card-title" x="234" y="516">Grafana</text>
  <text class="detail" x="234" y="548">Metrics visualization and dashboard UI</text>
  <line x1="155" y1="592" x2="710" y2="592" stroke="#416a84" stroke-width="2"/>
  <text class="label" x="155" y="638">LOADBALANCER IP</text>
  <text class="value" x="155" y="677">192.168.0.200</text>
  <text class="label" x="484" y="638">PORT</text>
  <text class="value" x="484" y="677">80 / HTTP</text>
  <text class="small" x="155" y="727">Namespace: grafana</text>

  <rect x="845" y="438" width="645" height="328" rx="24" fill="#102940" stroke="#3d7798" stroke-width="2" filter="url(#shadow)"/>
  <rect x="845" y="438" width="645" height="12" rx="6" fill="#69c7ff"/>
  <circle cx="909" cy="521" r="35" fill="#69c7ff"/>
  <path d="M893 502h32v38h-32zM901 512h16M901 522h16" fill="none" stroke="#062439" stroke-width="4" stroke-linejoin="round"/>
  <text class="card-title" x="969" y="516">Homepage</text>
  <text class="detail" x="969" y="548">Home server services dashboard</text>
  <line x1="890" y1="592" x2="1445" y2="592" stroke="#416a84" stroke-width="2"/>
  <text class="label" x="890" y="638">LOADBALANCER IP</text>
  <text class="value" x="890" y="677">192.168.0.201</text>
  <text class="label" x="1219" y="638">PORT</text>
  <text class="value" x="1219" y="677">80 / HTTP</text>
  <text class="small" x="890" y="727">Namespace: homepage</text>

  <text class="small" x="110" y="835">Source: current Kubernetes service configuration in this repository</text>
  <text class="small" x="1490" y="835" text-anchor="end">2 deployed services</text>
</svg>
