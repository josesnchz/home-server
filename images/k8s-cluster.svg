<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Kubernetes cluster deployed with Terraform, Ansible, kubeadm, and Calico</title>
  <desc id="desc">Architecture diagram for one kubeadm control-plane VM and three worker VMs on Proxmox, using Calico networking.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .panel { fill: #ffffff; stroke: #d7dce5; stroke-width: 2; }
      .zone { fill: #eef6ff; stroke: #91b9e8; stroke-width: 2; }
      .node { fill: #ffffff; stroke: #3f556f; stroke-width: 2; }
      .control { fill: #f0f7ff; stroke: #2468a8; }
      .worker { fill: #f9fbfd; stroke: #496179; }
      .network { fill: #f1faf4; stroke: #55a868; }
      .tool { fill: #fff9ed; stroke: #d5962f; }
      .muted { fill: #596778; font-size: 16px; }
      .label { fill: #17202a; font-size: 20px; font-weight: 700; }
      .small { fill: #334155; font-size: 15px; }
      .tiny { fill: #475569; font-size: 13px; }
      .title { fill: #111827; font-size: 34px; font-weight: 800; }
      .subtitle { fill: #526070; font-size: 17px; }
      .line { stroke: #5c6f86; stroke-width: 2.5; fill: none; }
      .dash { stroke: #4d8d61; stroke-width: 2.5; fill: none; stroke-dasharray: 8 7; }
      .arrow { marker-end: url(#arrow); }
      .badge { fill: #e8eef6; stroke: #c9d3df; }
      .badgeText { fill: #334155; font-size: 13px; font-weight: 700; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5c6f86" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="780" />

  <text class="title" x="60" y="62">Home Server Kubernetes Cluster</text>
  <text class="subtitle" x="60" y="92">Terraform provisions Proxmox VMs, Ansible configures kubeadm, and Calico provides pod networking.</text>

  <rect class="tool" x="60" y="128" width="250" height="128" rx="8" />
  <text class="label" x="86" y="168">Terraform</text>
  <text class="small" x="86" y="198">Creates Proxmox VMs</text>
  <text class="tiny" x="86" y="224">target node: endurance</text>

  <rect class="tool" x="60" y="306" width="250" height="128" rx="8" />
  <text class="label" x="86" y="346">Ansible</text>
  <text class="small" x="86" y="376">Runs kubeadm setup</text>
  <text class="tiny" x="86" y="402">inventory: 192.168.0.60-63</text>

  <rect class="zone" x="370" y="128" width="770" height="500" rx="8" />
  <text class="label" x="400" y="168">Proxmox VE host</text>
  <text class="small" x="400" y="196">Physical host: endurance</text>

  <rect class="panel" x="400" y="230" width="710" height="350" rx="8" />
  <text class="label" x="430" y="270">kubeadm Kubernetes cluster</text>
  <text class="small" x="430" y="300">LAN: 192.168.0.0/24</text>

  <rect class="node control" x="440" y="335" width="250" height="160" rx="8" />
  <text class="label" x="466" y="374">k8s-master</text>
  <text class="small" x="466" y="404">192.168.0.60</text>
  <text class="tiny" x="466" y="434">Control plane</text>
  <text class="tiny" x="466" y="458">kube-apiserver, etcd</text>
  <text class="tiny" x="466" y="480">scheduler, controller</text>

  <rect class="node worker" x="760" y="315" width="270" height="88" rx="8" />
  <text class="label" x="786" y="350">k8s-worker-0</text>
  <text class="small" x="786" y="378">192.168.0.61</text>

  <rect class="node worker" x="760" y="421" width="270" height="88" rx="8" />
  <text class="label" x="786" y="456">k8s-worker-1</text>
  <text class="small" x="786" y="484">192.168.0.62</text>

  <rect class="node worker" x="760" y="527" width="270" height="88" rx="8" />
  <text class="label" x="786" y="562">k8s-worker-2</text>
  <text class="small" x="786" y="590">192.168.0.63</text>

  <path class="line arrow" d="M310 192 C340 192, 340 192, 370 192" />
  <path class="line arrow" d="M310 370 C346 370, 354 392, 440 392" />
  <path class="line arrow" d="M690 392 C720 392, 728 359, 760 359" />
  <path class="line arrow" d="M690 415 C720 415, 728 465, 760 465" />
  <path class="line arrow" d="M690 438 C720 438, 728 571, 760 571" />

  <rect class="network" x="400" y="650" width="710" height="74" rx="8" />
  <text class="label" x="430" y="688">Calico networking</text>
  <text class="small" x="665" y="688">Pod CIDR: 10.244.0.0/16</text>
  <text class="small" x="890" y="688">Service CIDR: 10.96.0.0/12</text>

  <path class="dash" d="M565 495 C565 585, 532 620, 505 650" />
  <path class="dash" d="M895 615 C895 635, 895 635, 895 650" />

  <rect class="badge" x="440" y="525" width="250" height="34" rx="8" />
  <text class="badgeText" x="459" y="547">containerd + kubelet + kubectl</text>

  <rect class="badge" x="760" y="246" width="270" height="34" rx="8" />
  <text class="badgeText" x="787" y="268">worker join via kubeadm token</text>
</svg>
